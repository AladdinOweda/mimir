name: Mimir CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-structure:
    name: Module graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify included modules have build scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path(".")
          settings = (root / "settings.gradle.kts").read_text()
          mods = re.findall(r'include\("([^"]+)"\)', settings)
          missing = []
          for m in mods:
              rel = m.strip(":").split(":")
              # projectDir overrides — resolve from settings lines
              path = root.joinpath(*rel)
              if not (path / "build.gradle.kts").exists():
                  # try mapped dirs
                  for line in settings.splitlines():
                      if f'project("{m}")' in line and "projectDir" in line:
                          m2 = re.search(r'file\("([^"]+)"\)', line)
                          if m2:
                              path = root / m2.group(1)
                  if not (path / "build.gradle.kts").exists():
                      missing.append(f"{m} -> {path}")
          print("modules", len(mods))
          if missing:
              print("missing:", missing)
              # soft-fail only for known scaffolds without gradle
              hard = [x for x in missing if "loop-runtime" not in x and "notifications" not in x]
              if hard:
                  raise SystemExit("Missing build scripts: " + ", ".join(hard[:20]))
          print("structure_ok")
          PY

  compile-test:
    name: Compile & unit tests
    runs-on: ubuntu-latest
    needs: verify-structure
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      - name: Verify Gradle leaf modules
        run: ./gradlew --no-daemon verifyModuleBuilds
      - name: Compile core chain
        run: |
          ./gradlew --no-daemon \
            :shared:kernel:compileKotlin \
            :contracts:capability:compileKotlin \
            :adapters:browser:compileKotlin \
            :shared:engine:browser:compileKotlin \
            :shared:engine:computer:compileKotlin \
            :shared:engine:terminal:compileKotlin \
            :shared:engine:process:compileKotlin \
            :shared:engine:forge:compileKotlin \
            :shared:engine:vault:compileKotlin \
            :shared:engine:provider:compileKotlin \
            :shared:engine:agent-runtime:compileKotlin \
            :shared:engine:verification:compileKotlin \
            :contracts:process:compileKotlin \
            :contracts:chat:compileKotlin \
            :engines:chat:compileKotlin \
            :engines:ai-hub:compileKotlin \
            :engines:collaboration:compileKotlin \
            :engines:unified-file-transfer:compileKotlin \
            :shared:engine:orchestration:compileKotlin \
            :shared:engine:workflow:compileKotlin \
            :shared:memory:compileKotlin \
            :shared:secrets:compileKotlin \
            :shared:ui:compileKotlin \
            :services:activity:compileKotlin \
            :services:approvals:compileKotlin \
            :services:tasks:compileKotlin \
            :contracts:knowledge:compileKotlin \
            :services:downloads:compileKotlin \
            :services:notifications:compileKotlin \
            :shared:events:compileKotlin \
            :shared:configuration:compileKotlin \
            :packages:app-composition:compileKotlin \
            :engines:loop-runtime:compileKotlin \
      - name: Kernel tests
        run: ./gradlew --no-daemon :shared:kernel:test
      - name: Tasks + kernel neutrality tests
        run: |
          ./gradlew --no-daemon :services:tasks:test :shared:kernel:test
      - name: Engine tests
        run: |
          ./gradlew --no-daemon --continue \
            :shared:engine:terminal:test \
            :shared:engine:browser:test \
            :shared:engine:process:test

  android-build:
    name: Android app build
    runs-on: ubuntu-latest
    needs: verify-structure
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android application
        run: bash ./gradlew --no-daemon :apps:androidApp:assembleDebug

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [compile-test, services-unit-tests, android-build]
    steps:
      - uses: actions/checkout@v4
      - name: canShip false
        run: |
          if grep -qiE 'canShip:\s*true' STATE.md RELEASE-GATE.md 2>/dev/null; then
            echo "Refuse canShip=true without human review"; exit 1
          fi
          test -f VERSION
          test -f CANONICAL.md || test -f STATE.md
          echo gate_ok


  services-unit-tests:
    name: Services unit tests (adequate RAM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle services tests
        env:
          GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false"
        run: |
          chmod +x gradlew || true
          bash ./gradlew --no-daemon --max-workers=2 \
            :services:downloads:test \
            :services:retention:test \
            :contracts:knowledge:test \
            :services:tasks:test \
            :shared:ui:test \
            :apps:android:test
